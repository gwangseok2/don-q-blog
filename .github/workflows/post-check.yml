# 글을 추가·수정하는 PR마다 rule.md 규칙을 검사합니다.
# (** 사용, 카테고리 오타, 커버 경로, 이미지 1MB 초과 등)
name: Post check

on:
  pull_request:
    paths:
      - "_posts/**"
      - "public/assets/blog/**"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock gray-matter@4.0.3
      - name: Audit changed posts
        run: |
          RANGE="origin/${{ github.base_ref }}...HEAD"
          ADDED=$(git diff --name-only --diff-filter=A "$RANGE" -- '_posts/*.md')
          MODIFIED=$(git diff --name-only --diff-filter=M "$RANGE" -- '_posts/*.md')
          if [ -z "$ADDED$MODIFIED" ]; then echo "변경된 글 없음"; exit 0; fi
          # 새 글: 모든 규칙 검사
          if [ -n "$ADDED" ]; then
            echo "새 글:"; echo "$ADDED"
            node scripts/audit-posts.mjs --strict $ADDED
          fi
          # 기존 글 수정: 파일명·커버 경로는 이미 발행된 URL·이미지라 바꾸지 않으므로 제외하고 검사
          if [ -n "$MODIFIED" ]; then
            echo "수정한 글:"; echo "$MODIFIED"
            node scripts/audit-posts.mjs --strict --legacy-ok $MODIFIED
          fi
